name: Temporary deployment verification

# Temporary helper created during the initial online deployment of this Fork.
# It only reads the deployed instance and is deleted after the setup check.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify deployed EdgeEver
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check /api/health and /api/openapi.json
        continue-on-error: true
        shell: bash
        env:
          BASE_URL: https://edgeever.3709368.workers.dev
        run: |
          set -uo pipefail
          health_code="$(curl -sS -m 30 -o health.json -w '%{http_code}' "$BASE_URL/api/health" || echo 000)"
          echo "health_status=$health_code"
          echo "health_body=$(cat health.json 2>/dev/null)"
          openapi_code="$(curl -sS -m 30 -o openapi.json -w '%{http_code}' "$BASE_URL/api/openapi.json" || echo 000)"
          echo "openapi_status=$openapi_code"
          node -e "const d=require('./openapi.json');console.log('openapi_ok='+(d.ok===true));console.log('openapi_top_keys='+Object.keys(d).join(','));console.log('openapi_paths_type='+(typeof d.paths))"

      - name: Check admin login
        continue-on-error: true
        shell: bash
        env:
          BASE_URL: https://edgeever.3709368.workers.dev
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ${{ vars.EDGE_EVER_VERIFY_PASSWORD }}
        run: |
          set -uo pipefail
          echo "::add-mask::$ADMIN_PASSWORD"
          login_code="$(curl -sS -m 30 -o login.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            --data "$(node -e 'console.log(JSON.stringify({username:process.env.ADMIN_USERNAME,password:process.env.ADMIN_PASSWORD}))')" \
            "$BASE_URL/api/v1/auth/login" || echo 000)"
          echo "login_status=$login_code"
          echo "login_body=$(cat login.json 2>/dev/null)"
          node -e "const d=require('./login.json');console.log('login_authenticated='+d.authenticated);console.log('login_sessionToken_present='+Boolean(d.sessionToken));console.log('login_username='+(d.user&&d.user.username))"
